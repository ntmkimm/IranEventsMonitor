<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>US-Iran Crisis Monitor</title>
    <link rel="stylesheet" href="./style.css">
    
    <script src="//unpkg.com/globe.gl"></script>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
</head>
<body>
    <header class="top-bar">
        <h1>🚨 GLOBAL INTEL</h1>
        
        <div id="oil-ticker" style="font-size: 0.9rem; letter-spacing: 1px; display: flex; gap: 15px;">
            <span>Đang tải dữ liệu năng lượng...</span>
        </div>
        
        <div class="map-controls">
            <button id="btn-2d" class="active">2D TACTICAL</button>
            <button id="btn-3d">3D GLOBE</button>
            
            <button id="btn-refresh-acled" style="color: #ffaa00; border-color: #ffaa00;">⚠️ SYNC EVENTS</button>
            <button id="btn-refresh-oil" style="color: #00ffff; border-color: #00ffff;">🛢️ SYNC OIL</button>
            <button id="btn-refresh-security" style="color: #00ffaa; border-color: #00ffaa;">🛡️ SYNC SECURITY</button>
        </div>
    </header>

    <main class="main-content">
        <section id="map-container">
            <div id="globe-viz" style="display: none;"></div>
            <div id="map-2d" style="display: block; width: 100%; height: 100%;"></div>
        </section>
        
        <!-- THÊM PANEL WEBCAM & SECURITY -->
        <section id="dashboard-panels">
            <!-- Webcam Panel -->
            <div id="webcam-panel" class="info-panel">
                <div class="panel-header">
                    <span class="panel-title">📹 LIVE WEBCAMS</span>
                    <div class="webcam-controls">
                        <button id="webcam-grid-view" class="webcam-view-btn active">⊞ Grid</button>
                        <button id="webcam-single-view" class="webcam-view-btn">⊡ Single</button>
                        <button id="webcam-fullscreen" class="webcam-fullscreen-btn">⤢</button>
                    </div>
                </div>
                <div id="webcam-content" class="panel-content">
                    <div class="webcam-placeholder">Loading webcams...</div>
                </div>
            </div>
            
            <!-- Security Advisories Panel -->
            <div id="security-panel" class="info-panel">
                <div class="panel-header">
                    <span class="panel-title">⚠️ SECURITY ADVISORIES</span>
                    <div class="security-filters">
                        <button class="sec-filter active" data-filter="all">All</button>
                        <button class="sec-filter" data-filter="critical">Critical</button>
                        <button class="sec-filter" data-filter="US">🇺🇸 US</button>
                    </div>
                </div>
                <div id="security-content" class="panel-content">
                    <div class="sec-placeholder">Loading security advisories...</div>
                </div>
            </div>
        </section>
    </main>

    <script type="module" src="./main.js"></script>
</body>
</html>
