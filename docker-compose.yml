version: '3.8'

services:
  app:
    build: .
    ports:
      - "3000:3000"   # Backend Flask
      - "5173:5173"   # Frontend Vite
    volumes:
      - ./backend/data:/app/backend/data
      - ./frontend:/app/frontend
    environment:
      - FLASK_ENV=development
      - PYTHONUNBUFFERED=1
    restart: unless-stopped