services:
  app:
    build: .
    container_name: wm
    ports:
      - "3000:3000"
      - "5173:5173"
    volumes:
      - .:/app
      - /app/node_modules         
      - ./backend/data:/app/backend/data
    command: npm run dev
    environment:
      - FLASK_ENV=development
      - PYTHONUNBUFFERED=1
    restart: unless-stopped